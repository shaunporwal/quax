<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800px" height="1100px" viewBox="0 0 800 1100" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Sample W-2 Form</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Form Background -->
        <rect fill="#FFFFFF" x="0" y="0" width="800" height="1100"></rect>
        
        <!-- Form Border -->
        <rect stroke="#000000" stroke-width="2" x="10" y="10" width="780" height="1080"></rect>
        
        <!-- Form Header -->
        <text font-family="Arial" font-size="22" font-weight="bold" fill="#000000">
            <tspan x="300" y="45">W-2 Wage and Tax Statement</tspan>
        </text>
        <text font-family="Arial" font-size="16" fill="#000000">
            <tspan x="320" y="70">TAX YEAR 2023</tspan>
        </text>
        
        <!-- Employer Section -->
        <rect stroke="#000000" x="20" y="90" width="370" height="150"></rect>
        <text font-family="Arial" font-size="12" fill="#000000">
            <tspan x="30" y="110">EMPLOYER'S NAME, ADDRESS, AND ZIP CODE</tspan>
        </text>
        <text font-family="Arial" font-size="14" fill="#000000">
            <tspan x="40" y="140">ACME CORPORATION</tspan>
            <tspan x="40" y="160">123 BUSINESS LANE</tspan>
            <tspan x="40" y="180">SAN FRANCISCO, CA 94103</tspan>
        </text>
        
        <!-- Employer EIN -->
        <rect stroke="#000000" x="400" y="90" width="370" height="60"></rect>
        <text font-family="Arial" font-size="12" fill="#000000">
            <tspan x="410" y="110">EMPLOYER'S EIN</tspan>
        </text>
        <text font-family="Arial" font-size="14" fill="#000000">
            <tspan x="430" y="135">12-3456789</tspan>
        </text>
        
        <!-- Employee SSN -->
        <rect stroke="#000000" x="400" y="150" width="370" height="60"></rect>
        <text font-family="Arial" font-size="12" fill="#000000">
            <tspan x="410" y="170">EMPLOYEE'S SSN</tspan>
        </text>
        <text font-family="Arial" font-size="14" fill="#000000">
            <tspan x="430" y="195">XXX-XX-1234</tspan>
        </text>
        
        <!-- Employee Info -->
        <rect stroke="#000000" x="20" y="240" width="370" height="100"></rect>
        <text font-family="Arial" font-size="12" fill="#000000">
            <tspan x="30" y="260">EMPLOYEE'S NAME AND ADDRESS</tspan>
        </text>
        <text font-family="Arial" font-size="14" fill="#000000">
            <tspan x="40" y="285">JOHN Q. TAXPAYER</tspan>
            <tspan x="40" y="305">456 RESIDENCE STREET</tspan>
            <tspan x="40" y="325">SAN FRANCISCO, CA 94103</tspan>
        </text>
        
        <!-- Boxes -->
        <!-- Box 1 -->
        <rect stroke="#000000" x="20" y="350" width="180" height="80"></rect>
        <text font-family="Arial" font-size="11" fill="#000000">
            <tspan x="25" y="365">1 Wages, tips, other compensation</tspan>
        </text>
        <text font-family="Arial" font-size="14" font-weight="bold" fill="#000000">
            <tspan x="50" y="405">$72,000.00</tspan>
        </text>
        
        <!-- Box 2 -->
        <rect stroke="#000000" x="200" y="350" width="180" height="80"></rect>
        <text font-family="Arial" font-size="11" fill="#000000">
            <tspan x="205" y="365">2 Federal income tax withheld</tspan>
        </text>
        <text font-family="Arial" font-size="14" font-weight="bold" fill="#000000">
            <tspan x="230" y="405">$15,840.00</tspan>
        </text>
        
        <!-- Box 3 -->
        <rect stroke="#000000" x="380" y="350" width="180" height="80"></rect>
        <text font-family="Arial" font-size="11" fill="#000000">
            <tspan x="385" y="365">3 Social security wages</tspan>
        </text>
        <text font-family="Arial" font-size="14" font-weight="bold" fill="#000000">
            <tspan x="410" y="405">$72,000.00</tspan>
        </text>
        
        <!-- Box 4 -->
        <rect stroke="#000000" x="560" y="350" width="180" height="80"></rect>
        <text font-family="Arial" font-size="11" fill="#000000">
            <tspan x="565" y="365">4 Social security tax withheld</tspan>
        </text>
        <text font-family="Arial" font-size="14" font-weight="bold" fill="#000000">
            <tspan x="590" y="405">$4,464.00</tspan>
        </text>
        
        <!-- Box 5 -->
        <rect stroke="#000000" x="20" y="430" width="180" height="80"></rect>
        <text font-family="Arial" font-size="11" fill="#000000">
            <tspan x="25" y="445">5 Medicare wages and tips</tspan>
        </text>
        <text font-family="Arial" font-size="14" font-weight="bold" fill="#000000">
            <tspan x="50" y="485">$72,000.00</tspan>
        </text>
        
        <!-- Box 6 -->
        <rect stroke="#000000" x="200" y="430" width="180" height="80"></rect>
        <text font-family="Arial" font-size="11" fill="#000000">
            <tspan x="205" y="445">6 Medicare tax withheld</tspan>
        </text>
        <text font-family="Arial" font-size="14" font-weight="bold" fill="#000000">
            <tspan x="230" y="485">$1,044.00</tspan>
        </text>
        
        <!-- State Section -->
        <rect stroke="#000000" x="20" y="520" width="760" height="80"></rect>
        <text font-family="Arial" font-size="11" fill="#000000">
            <tspan x="25" y="535">15 State</tspan>
            <tspan x="205" y="535">16 State wages, tips, etc.</tspan>
            <tspan x="385" y="535">17 State income tax</tspan>
        </text>
        <text font-family="Arial" font-size="14" font-weight="bold" fill="#000000">
            <tspan x="50" y="575">CA</tspan>
            <tspan x="230" y="575">$72,000.00</tspan>
            <tspan x="410" y="575">$5,760.00</tspan>
        </text>
        
        <!-- Local Section -->
        <rect stroke="#000000" x="20" y="600" width="760" height="80"></rect>
        <text font-family="Arial" font-size="11" fill="#000000">
            <tspan x="25" y="615">18 Local wages, tips, etc.</tspan>
            <tspan x="205" y="615">19 Local income tax</tspan>
            <tspan x="385" y="615">20 Locality name</tspan>
        </text>
        <text font-family="Arial" font-size="14" font-weight="bold" fill="#000000">
            <tspan x="50" y="655">$72,000.00</tspan>
            <tspan x="230" y="655">$720.00</tspan>
            <tspan x="410" y="655">SF CITY/COUNTY</tspan>
        </text>
        
        <!-- Notice Text -->
        <text font-family="Arial" font-size="12" fill="#666666">
            <tspan x="20" y="720">SAMPLE W2 FORM - FOR DEMONSTRATION PURPOSES ONLY</tspan>
        </text>
    </g>
</svg>