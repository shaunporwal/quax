<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>W2 Loader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 300px;
            padding: 10px;
        }

        input,
        button {
            width: 100%;
            margin: 5px 0;
        }
    </style>
</head>

<body>
    <h3>Load W‑2 PDF</h3>
    <input type="file" id="w2file" accept="application/pdf" />
    <button id="parseBtn">Parse W‑2</button>
    <div id="status"></div>
    <script src="pdf.js"></script>
    <script src="popup.js"></script>
</body>

</html>
